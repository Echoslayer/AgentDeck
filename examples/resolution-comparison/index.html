<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>解析度比較 · 互動組合</title><link rel="stylesheet" href="../demo.css"></head><body><main>
<header><a href="../index.html">← 組合範例</a><a href="README.md">實作前必讀</a></header><h1>平均之後，還看得出局部差異嗎？</h1><p>同一份矩陣 → 調整聚合尺度 → 對照空間細節。色階固定，不隨右側結果重新縮放。</p>
